name: Build Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  make-libs:
    name: Building and deploying on ${{ matrix.os }} - ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-26.04
            compiler: gcc
            terminal: bash
            archive_ext: tar.gz

          - os: windows-latest
            compiler: msvc
            terminal: bash
            archive_ext: zip

          - os: windows-latest
            compiler: mingw
            terminal: msys2 {0}
            archive_ext: zip

    steps:
      - uses: actions/checkout@v7

      - name: Setup Allegro 5 Deps
        uses: LunarisLib/actions/InstallAllegroDeps5@revamp
        with:
          compiler: ${{ matrix.compiler }}

      - name: Build & Test
        uses: LunarisLib/actions/Build@revamp
        with:
          compiler: ${{ matrix.compiler }}
          shell: ${{ matrix.terminal }}
          install: true
          upload_executable: false
          test: true
            
